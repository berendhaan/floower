# ============================================================
# Floower ESPHome Configuration
# ============================================================
# Converts the original BLE-based Floower firmware into a
# WiFi-connected Home Assistant device.
#
# Hardware:
#   - ESP32 microcontroller
#   - 7× WS2812b NeoPixel LEDs  (GPIO27, power GPIO25 active-LOW)
#   - Servo motor for petals     (GPIO26 PWM, power GPIO33 active-LOW)
#   - Capacitive touch leaf      (GPIO4)
#   - Battery voltage ADC        (GPIO36, 1:1 divider)
#   - USB detect ADC             (GPIO39, HW rev ≥ 6 only)
#   - Activity LED               (GPIO2)
#
# Entities exposed to Home Assistant:
#   light.floower_light        – color + effects (Rainbow, Candle)
#   cover.floower_petals       – open / close petals
#   sensor.floower_battery_level   – battery %
#   sensor.floower_battery_voltage – battery V
#   binary_sensor.floower_usb_powered
#   binary_sensor.floower_leaf_touch
#
# Touch behaviour (matches original firmware):
#   Tap          : STANDBY → light on → open → close → STANDBY
#   Long (>2 s)  : Rainbow animation
#   Hold (>5 s)  : Flash blue (WiFi-mode feedback, replaces BLE init)
# ============================================================

substitutions:
  device_name: floower
  friendly_name: Floower

  # ── Servo calibration ──────────────────────────────────────
  # Pulse widths are stored in EEPROM by the factory.  Read them
  # from the original firmware's serial log (HW: <closed> -> <open>)
  # and convert:  level% = (pulse_µs / 20 000) × 100
  # Defaults match the firmware comment: closed ≈ 800 µs, open ≈ 1300 µs
  servo_min_level: "4.0%"   # closed position  (≈ 800 µs at 50 Hz)
  servo_max_level: "6.5%"   # open   position  (≈ 1300 µs at 50 Hz)

  # ── Touch sensitivity ──────────────────────────────────────
  # Lower value = more sensitive.  Rev 7: 45  |  Rev 8+: 50
  touch_threshold: "45"

  # ── Timing (milliseconds) ──────────────────────────────────
  open_close_duration: "5000ms"   # time for petals to fully open/close
  init_close_duration: "3000ms"   # boot-time close (petals may already be near closed)
  light_transition:    "3s"       # LED colour-change transition

# ============================================================
# CORE
# ============================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100          # run after all components are ready
    then:
      - script.execute: init_floower

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 115200

# Home Assistant native API
api:
  encryption:
    key: !secret api_encryption_key

# Over-the-air updates
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback access-point when WiFi is unreachable
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:

# ============================================================
# GLOBALS  (state machine + touch tracking)
# ============================================================

globals:
  # Floower state machine
  # 0 = STANDBY     (petals closed, light off)
  # 1 = BLOOMING    (light on, petals not yet opened)
  # 2 = RUNNING_OPEN   (petals open, light on)
  # 3 = RUNNING_CLOSED (petals closed, light on)
  # 11 = RAINBOW    (rainbow animation running)
  - id: floower_state
    type: int
    restore_value: no
    initial_value: "0"

  # Touch timing
  - id: touch_start_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"

  # Prevent double-firing on long / hold touch
  - id: long_touch_fired
    type: bool
    restore_value: no
    initial_value: "false"
  - id: hold_touch_fired
    type: bool
    restore_value: no
    initial_value: "false"

  # Suppress the touch-UP action that follows a long/hold touch or
  # a touch-DOWN that already changed state (matches disabledTouchUp
  # in the original automaton).
  - id: disable_next_touch_up
    type: bool
    restore_value: no
    initial_value: "false"

  # Colour-scheme index (cycles through 8 preset colours)
  - id: color_index
    type: int
    restore_value: no
    initial_value: "0"

# ============================================================
# OUTPUTS
# ============================================================

output:
  # Servo PWM signal (50 Hz / 20 ms period)
  - platform: ledc
    pin: GPIO26
    id: servo_output
    frequency: 50Hz

  # Servo motor power (active-LOW: LOW = powered on)
  - platform: gpio
    pin:
      number: GPIO33
      inverted: true
    id: servo_power

  # NeoPixel strip power (active-LOW: LOW = powered on)
  - platform: gpio
    pin:
      number: GPIO25
      inverted: true
    id: neopixel_power

  # Activity / status LED on the logic board
  - platform: gpio
    pin: GPIO2
    id: acty_led

# ============================================================
# SERVO  (petals mechanism)
# ============================================================

servo:
  - id: floower_servo
    output: servo_output
    min_level: ${servo_min_level}
    max_level: ${servo_max_level}

# ============================================================
# LIGHT  (7× WS2812b NeoPixel, GRB order)
# ============================================================

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO27
    num_leds: 7
    name: "Light"
    id: floower_light
    # Disable built-in gamma so colours match the original firmware
    gamma_correct: 0
    default_transition_length: ${light_transition}
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - flicker:
          name: Candle
          alpha: 0.95
          intensity: 0.15
    on_turn_on:
      - output.turn_on: neopixel_power
    on_turn_off:
      - output.turn_off: neopixel_power

# ============================================================
# SENSORS
# ============================================================

sensor:
  # ── Battery voltage (GPIO36, 1:1 resistor divider) ──────
  - platform: adc
    pin: GPIO36
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 11db
    filters:
      # (reading / 4095) × 3.6 V reference × 2 (divider) ≈ × 0.00181
      - multiply: 0.00181
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    update_interval: 30s

  # ── USB-detect ADC (GPIO39, HW rev ≥ 6) ────────────────
  - platform: adc
    pin: GPIO39
    id: usb_adc
    attenuation: 11db
    internal: true
    update_interval: 30s

  # ── Battery level (derived from voltage) ────────────────
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    # 3.3 V = 0 %,  4.2 V = 100 %  (matches original formula)
    lambda: |-
      float v = id(battery_voltage).state;
      float level = (v - 3.3f) * 111.0f;
      if (level < 0.0f) level = 0.0f;
      if (level > 100.0f) level = 100.0f;
      return level;
    update_interval: 30s

# ============================================================
# BINARY SENSORS
# ============================================================

esp32_touch:
  setup_checks: 3
  sleep_duration: 27ms

binary_sensor:
  # ── Capacitive touch leaf ────────────────────────────────
  - platform: esp32_touch
    name: "Leaf Touch"
    id: leaf_touch
    pin: GPIO4
    threshold: ${touch_threshold}
    filters:
      - delayed_on: 10ms      # debounce
      - delayed_off: 75ms     # TOUCH_FADE_TIME from original firmware
    on_press:
      then:
        - lambda: |-
            id(touch_start_ms) = millis();
            id(long_touch_fired) = false;
            id(hold_touch_fired) = false;
        - script.execute: on_touch_down
    on_release:
      then:
        - script.execute: on_touch_up

  # ── USB / charger detection (HW rev ≥ 6) ────────────────
  # USB 5 V passes through a resistor divider; ~2900/4095 × 3.6 V ≈ 2.55 V
  # when present.  Use 1.5 V as a safe mid-point threshold.
  - platform: template
    name: "USB Powered"
    id: usb_powered
    device_class: plug
    lambda: |-
      return id(usb_adc).state > 1.5f;

# ============================================================
# COVER  (petals – exposed to Home Assistant)
# ============================================================

cover:
  - platform: template
    name: "Petals"
    id: floower_petals
    device_class: blind
    optimistic: true
    open_action:
      - script.execute: open_petals
    close_action:
      - script.execute: close_petals

# ============================================================
# INTERVAL  (long / hold touch detection)
# Checks every 100 ms while the leaf is held down.
# ============================================================

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            binary_sensor.is_on: leaf_touch
          then:
            - lambda: |-
                unsigned long dur = millis() - id(touch_start_ms);
                if (!id(long_touch_fired) && dur >= 2000UL) {
                  id(long_touch_fired) = true;
                  id(on_touch_long).execute();
                }
                if (!id(hold_touch_fired) && dur >= 5000UL) {
                  id(hold_touch_fired) = true;
                  id(on_touch_hold).execute();
                }

# ============================================================
# SCRIPTS
# ============================================================

script:
  # ── Hardware initialisation at boot ──────────────────────
  - id: init_floower
    then:
      - output.turn_on: servo_power
      - servo.write:
          id: floower_servo
          level: -100%        # drive to closed position
      - delay: ${init_close_duration}
      - output.turn_off: servo_power
      - lambda: "id(floower_state) = 0;"

  # ── Open petals (HA cover or state-machine) ───────────────
  - id: open_petals
    mode: restart           # restart if called again mid-movement
    then:
      - output.turn_on: servo_power
      - servo.write:
          id: floower_servo
          level: 100%         # drive to open position
      - delay: ${open_close_duration}
      - output.turn_off: servo_power

  # ── Close petals (HA cover or state-machine) ──────────────
  - id: close_petals
    mode: restart
    then:
      - output.turn_on: servo_power
      - servo.write:
          id: floower_servo
          level: -100%        # drive to closed position
      - delay: ${open_close_duration}
      - output.turn_off: servo_power

  # ── Touch DOWN ────────────────────────────────────────────
  # Mirrors TOUCH_DOWN in the original automaton.
  - id: on_touch_down
    then:
      - if:
          condition:
            lambda: "return id(floower_state) == 0;"   # STANDBY
          then:
            - lambda: "id(floower_state) = 1;"          # → BLOOMING
            - script.execute: light_next_color
      - if:
          condition:
            lambda: "return id(floower_state) == 11;"  # RAINBOW
          then:
            # Stop the rainbow and stay in the current colour
            - light.turn_on:
                id: floower_light
                brightness: 70%
                transition_length: 500ms
            - lambda: |-
                id(floower_state) = 2;           // → RUNNING_OPEN
                id(disable_next_touch_up) = true;

  # ── Touch UP (short tap) ──────────────────────────────────
  # Mirrors TOUCH_UP in the original automaton.
  - id: on_touch_up
    then:
      - if:
          condition:
            # Suppress if long/hold already handled this gesture
            lambda: |-
              return id(long_touch_fired)
                  || id(hold_touch_fired)
                  || id(disable_next_touch_up);
          then:
            - lambda: "id(disable_next_touch_up) = false;"
          else:
            # Advance the state machine
            - lambda: |-
                int s = id(floower_state);
                if      (s == 1) id(floower_state) = 2; // BLOOMING  → RUNNING_OPEN
                else if (s == 2) id(floower_state) = 3; // R_OPEN    → RUNNING_CLOSED
                else if (s == 3) id(floower_state) = 0; // R_CLOSED  → STANDBY
            - if:
                condition:
                  lambda: "return id(floower_state) == 2;"
                then:
                  - script.execute: open_petals
            - if:
                condition:
                  lambda: "return id(floower_state) == 3;"
                then:
                  - script.execute: close_petals
            - if:
                condition:
                  lambda: "return id(floower_state) == 0;"
                then:
                  - light.turn_off:
                      id: floower_light
                      transition_length: ${light_transition}

  # ── Long touch (>2 s): Rainbow ────────────────────────────
  - id: on_touch_long
    then:
      - light.turn_on:
          id: floower_light
          effect: Rainbow
      - lambda: |-
          id(floower_state) = 11;
          id(disable_next_touch_up) = true;

  # ── Hold touch (>5 s): WiFi-mode feedback ─────────────────
  # Original firmware used this to start BLE advertising.
  # Here we flash blue to indicate the device is WiFi-connected.
  - id: on_touch_hold
    then:
      - light.turn_on:
          id: floower_light
          red: 0%
          green: 0%
          blue: 100%
          brightness: 100%
          transition_length: 200ms
      - delay: 1s
      - light.turn_on:
          id: floower_light
          red: 0%
          green: 0%
          blue: 100%
          brightness: 0%
          transition_length: 500ms
      - lambda: "id(disable_next_touch_up) = true;"

  # ── Cycle to next preset colour ───────────────────────────
  # Replicates Config::resetColorScheme() defaults and the
  # nextRandomColor() sequential cycling in automaton.cpp.
  - id: light_next_color
    then:
      - lambda: |-
          // Default colour scheme: White, Yellow, Orange, Red,
          //                        Pink, Purple, Blue, Green
          static const float hues[] =
              { 0.0f, 0.16f, 0.06f, 0.0f, 0.93f, 0.81f, 0.61f, 0.30f };
          static const float sats[] =
              { 0.0f, 1.0f,  1.0f,  1.0f, 1.0f,  1.0f,  1.0f,  1.0f  };
          static const int NUM_COLORS = 8;

          int idx = id(color_index) % NUM_COLORS;
          id(color_index) = (id(color_index) + 1) % NUM_COLORS;

          float h = hues[idx];
          float s = sats[idx];
          float v = 0.7f;   // DEFAULT_COLOR_BRIGHTNESS = 70 %

          // HSV → RGB conversion
          float r, g, b;
          if (s == 0.0f) {
            r = g = b = v;
          } else {
            float hh = h * 6.0f;
            int sector = (int)hh % 6;
            float f = hh - (int)hh;
            float p = v * (1.0f - s);
            float q = v * (1.0f - s * f);
            float t = v * (1.0f - s * (1.0f - f));
            switch (sector) {
              case 0: r = v; g = t; b = p; break;
              case 1: r = q; g = v; b = p; break;
              case 2: r = p; g = v; b = t; break;
              case 3: r = p; g = q; b = v; break;
              case 4: r = t; g = p; b = v; break;
              default: r = v; g = p; b = q; break;
            }
          }

          auto call = id(floower_light).turn_on();
          call.set_rgb(r, g, b);
          call.set_brightness(v);
          call.set_transition_length(3000);
          call.perform();
